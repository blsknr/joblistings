<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Joblistings</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/profile.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt</a>
  <header class="bar">
    <a class="brand" href="/">joblistings</a>
    <nav class="tabs" aria-label="Hauptnavigation">
      <button class="tab" data-view="active">Stellen <span class="count" id="nav-count">0</span></button>
      <button class="tab" data-view="archived">Archiv <span class="count" id="archive-count">0</span></button>
      <button class="tab" data-view="profile">Suchprofil</button>
    </nav>
    <a class="bar-link" href="/api/export">Export</a>
  </header>

  <main id="main">
    <div id="dashboard-view">
      <form id="import-form" class="add">
        <label for="job-url">Neue Stelle</label>
        <div class="add-row">
          <input type="text" inputmode="url" id="job-url" placeholder="Link zur Stellenanzeige" autocomplete="off" required maxlength="4096">
          <button type="submit" class="btn btn-primary" id="import-button">Hinzufügen</button>
        </div>
        <p class="feedback" id="import-feedback" role="status"></p>
      </form>

      <dl class="stats" id="stats">
        <div><dt>Aktiv</dt><dd id="stat-total">0</dd></div>
        <div><dt>Beworben</dt><dd id="stat-applied">0</dd></div>
        <div><dt>Gespräche</dt><dd id="stat-interview">0</dd></div>
      </dl>
      <p class="profile-line" id="profile-line"></p>

      <section aria-labelledby="jobs-title">
        <div class="jobs-head">
          <h1 id="jobs-title">Stellen</h1>
          <span class="count" id="result-count"></span>
          <span class="pending" id="pending-label"></span>
        </div>
        <div class="toolbar">
          <input type="search" id="search" aria-label="Stellen durchsuchen" placeholder="Suchen">
          <select id="status-filter" aria-label="Status filtern"><option value="">Alle Status</option></select>
          <select id="job-type-filter" aria-label="Jobart filtern"><option value="">Alle Jobarten</option></select>
          <select id="category-filter" aria-label="Kategorie filtern"><option value="">Alle Kategorien</option></select>
          <select id="sort" aria-label="Sortieren"><option value="new">Neueste zuerst</option><option value="updated">Zuletzt bearbeitet</option><option value="company">Unternehmen A–Z</option></select>
        </div>
        <div id="load-error" class="error" role="alert" hidden></div>
        <div class="list">
          <div class="list-head" aria-hidden="true"><span>Stelle</span><span>Ort · Umfang</span><span>Status</span><span>Datum</span></div>
          <div id="job-list" aria-live="polite"></div>
        </div>
      </section>
    </div>

    <section id="profile-view" hidden aria-labelledby="profile-title">
      <div class="view-head"><h1 id="profile-title">Suchprofil</h1><p>Listen durch Komma trennen. Änderungen gelten auch für gespeicherte Stellen.</p></div>
      <div id="profile-editor"></div>
    </section>
  </main>

  <dialog id="detail-dialog" class="detail-dialog" aria-label="Stellendetails">
    <div class="drawer-top"><span id="detail-label">Stelle</span><button class="icon-btn close-detail" aria-label="Schließen">×</button></div>
    <div id="detail-content"></div>
  </dialog>

  <div id="toast" role="status" hidden></div>
</body>
</html>
